[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dma-mcp"
version = "0.1.0a0"
description = "MCP server exposing DMA memory tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dma-sdk>=0.1.0a0", "mcp[cli]>=1.0"]

[project.scripts]
dma-mcp = "dma_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dma_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
