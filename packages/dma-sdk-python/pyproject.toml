[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dma-sdk"
version = "0.1.0a0"
description = "Python client for the DMA agent-memory API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DMA Contributors" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dma"]

[tool.ruff]
line-length = 100
target-version = "py311"
