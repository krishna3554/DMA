[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dma-langgraph"
version = "0.1.0a0"
description = "Thin LangGraph node helpers for DMA memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["dma-sdk>=0.1.0a0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1"]
langgraph = ["langgraph>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dma_langgraph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
