name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Python quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Create isolated environment
        run: uv venv services/dma-api/.venv --python python3
      - name: Install DMA packages
        run: >-
          uv pip install --python services/dma-api/.venv/bin/python
          -e 'services/dma-api[dev]'
          -e packages/dma-sdk-python
          -e packages/dma-langgraph
          -e packages/dma-mcp
      - name: Test, lint, and type-check
        run: make check
      - name: Build distributable packages
        run: make build
      - name: Install built wheels in a fresh environment
        run: make verify-wheels
      - name: Run benchmark baselines
        run: |
          make benchmark
          make classify-benchmark
          make benchmark-gated
      - name: Verify self-hosted Docker deployment
        env:
          DMA_API_KEY: ci-container-validation-key
        run: |
          docker compose build
          docker compose up -d
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/healthz
          services/dma-api/.venv/bin/python examples/basic-python/main.py
      - name: Stop self-hosted Docker deployment
        if: always()
        env:
          DMA_API_KEY: ci-container-validation-key
        run: docker compose down -v
